# Version ranges (not pins) so aksci fits into an existing project's
# environment instead of forcing exact versions and creating conflicts.
dependencies = [
    "numpy>=1.24,<3",
    "pandas>=2.0,<3",
    "polars>=0.20,<2",
    "pyarrow>=14.0,<21",  # required by polars for polars<->pandas conversion
    "scipy>=1.11,<2",
    "scikit-learn>=1.3,<2",
    "matplotlib>=3.7,<4",
    "joblib>=1.3,<2",
]

[project.optional-dependencies]
# Only needed if you use ErrorResolver(ai_client=AIClient(...)) for
# cloud-based AI-assist. Core AK-SCI works fully offline without this.
ai = ["anthropic>=0.30"]
dev = ["pytest>=7.4", "build>=1.0"]

[project.urls]
Homepage = "https://example.com/aksci"
Repository = "https://example.com/aksci"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
